<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}ЭлектроЩит — Учёт калькуляций{% endblock %}</title>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.13.5/cdn.min.js"></script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav class="topnav">
  <div class="topnav-brand">ЭлектроЩит <span style="opacity:0.5; font-weight:400; font-size:0.75em;">{{ APP_VERSION }}</span></div>
  <div class="topnav-menu">
    {% for section in NAV_MENU %}
    <div class="nav-dropdown">
      <span class="nav-link nav-dropdown-title" tabindex="0">{{ section.title }}</span>
      <div class="nav-dropdown-panel">
        {% if section.links %}
          {% for item in section.links %}
          <a href="{{ item.url }}" class="nav-dropdown-item">{{ item.label }}</a>
          {% endfor %}
        {% else %}
          <span class="nav-dropdown-empty">Пока пусто</span>
        {% endif %}
      </div>
    </div>
    {% endfor %}
  </div>
</nav>
<main class="page-main">
{% block content %}{% endblock %}
</main>
</body>
</html>
