{% extends "base.html" %}
{% block content %}
<div x-data="brandsPage()" x-init="init()">

  <div id="js-error-banner" style="display:none; background:#f3e6e3; border:1px solid #9c3b2e; color:#9c3b2e; padding:10px 16px; margin:0 0 12px; font-family:monospace; font-size:12px; white-space:pre-wrap;"></div>

  <div class="topbar">
    <div class="topbar-title">
      <h1>Бренды</h1>
      <span class="count" x-text="brands.length + ' позиций'"></span>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="btn btn-primary" @click="openCreate()">+ Бренд</button>
    </div>
  </div>

  <div class="filterbar">
    <div class="search-wrap">
      <input class="search-input" type="text" placeholder="Поиск по названию…"
             x-model="q" @input.debounce.300ms="load()">
      <button type="button" class="search-clear" title="Сбросить поиск" @click="q=''; load()">✕</button>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Название</th>
          <th style="width:140px">Материалов</th>
          <th style="width:70px"></th>
        </tr>
      </thead>
      <tbody>
        <template x-for="b in brands" :key="b.id">
          <tr @click="openEdit(b)">
            <td x-text="b.name"></td>
            <td x-text="b.materials_count"></td>
            <td></td>
          </tr>
        </template>
        <tr x-show="brands.length === 0">
          <td colspan="3" style="text-align:center; color:var(--ink-soft); padding:24px;">Ничего не найдено</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="modal-backdrop" x-show="modalOpen" x-cloak>
    <div class="modal">
      <div class="modal-header">
        <div>
          <h2 x-text="editing.id ? 'Редактирование бренда' : 'Новый бренд'"></h2>
        </div>
      </div>

      <div class="modal-body">
        <div class="field">
          <label>Название</label>
          <input type="text" required placeholder="ABB" x-model="editing.name">
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-danger-ghost" x-show="editing.id" @click="remove()">Удалить</button>
        <span x-show="!editing.id"></span>
        <div class="modal-footer-right">
          <button type="button" class="btn btn-ghost" @click="close()">Закрыть</button>
          <button type="button" class="btn btn-primary" @click="save()">Сохранить</button>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
window.addEventListener('error', function(e) {
  var banner = document.getElementById('js-error-banner');
  if (banner) {
    banner.style.display = 'block';
    banner.textContent = 'JS-ошибка: ' + e.message + '\n(строка ' + e.lineno + ', колонка ' + e.colno + ')';
  }
});

function showJsError(err) {
  var banner = document.getElementById('js-error-banner');
  if (banner) {
    banner.style.display = 'block';
    banner.textContent = 'JS-ошибка: ' + (err && err.message ? err.message : err);
  }
}

function brandsPage() {
  return {
    brands: [],
    q: '',
    modalOpen: false,
    editing: {},

    async init() {
      try { await this.load(); } catch (err) { showJsError(err); }
    },

    async load() {
      try {
        const params = new URLSearchParams();
        if (this.q) params.set('q', this.q);
        const res = await fetch('/api/brands?' + params.toString());
        this.brands = await res.json();
      } catch (err) { showJsError(err); }
    },

    openCreate() {
      try {
        this.editing = { name: '' };
        this.modalOpen = true;
      } catch (err) { showJsError(err); }
    },

    openEdit(b) {
      try {
        this.editing = { ...b };
        this.modalOpen = true;
      } catch (err) { showJsError(err); }
    },

    async save() {
      try {
        const isEdit = !!this.editing.id;
        const url = isEdit ? `/api/brands/${this.editing.id}` : '/api/brands';
        const method = isEdit ? 'PUT' : 'POST';

        const res = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: this.editing.name })
        });
        if (!res.ok) {
          const text = await res.text();
          showJsError('Сервер ответил ' + res.status + ': ' + text);
          return;
        }

        this.modalOpen = false;
        await this.load();
      } catch (err) { showJsError(err); }
    },

    async remove() {
      try {
        const res = await fetch(`/api/brands/${this.editing.id}`, { method: 'DELETE' });
        if (!res.ok) {
          const text = await res.text();
          showJsError('Не удалось удалить. Сервер ответил ' + res.status + ': ' + text);
          return;
        }

        this.modalOpen = false;
        await this.load();
      } catch (err) { showJsError(err); }
    },

    close() {
      try {
        this.modalOpen = false;
      } catch (err) { showJsError(err); }
    }
  };
}
</script>
{% endblock %}
