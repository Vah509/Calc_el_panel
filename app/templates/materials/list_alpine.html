{% extends "base.html" %}
{% block content %}
<div x-data="materialsPage()" x-init="init()">

  <div class="topbar">
    <div class="topbar-title">
      <h1>Материалы</h1>
      <span class="count" x-text="materials.length + ' позиций'"></span>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="btn">Импорт из Excel</button>
      <button class="btn btn-primary" @click="openCreate()">+ Материал</button>
    </div>
  </div>

  <div class="filterbar">
    <div class="search-wrap">
      <input class="search-input" type="text" placeholder="Поиск по short_name или артикулу…"
             x-model="q" @input.debounce.300ms="load()">
      <button type="button" class="search-clear" title="Сбросить поиск" @click="q=''; load()">✕</button>
    </div>
    <span style="width:1px;height:20px;background:var(--line);margin:0 4px;"></span>
    <span class="chip" :class="{active: !activeBrandId}" @click="activeBrandId=null; load()">Все бренды</span>
    <template x-for="brand in brands" :key="brand.id">
      <span class="chip" :class="{active: activeBrandId === brand.id}"
            @click="activeBrandId = brand.id; load()" x-text="brand.name"></span>
    </template>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th style="width:26%">Short name</th>
          <th style="width:26%">Full name</th>
          <th>Бренд</th>
          <th style="width:90px">Артикул</th>
          <th class="col-num" style="width:100px">Цена без НДС</th>
          <th class="col-num" style="width:100px">Цена с НДС</th>
          <th style="width:60px">НДС</th>
          <th style="width:70px"></th>
        </tr>
      </thead>
      <tbody>
        <template x-for="m in materials" :key="m.id">
          <tr @click="openEdit(m)">
            <td x-text="m.short_name"></td>
            <td x-text="m.full_name"></td>
            <td>
              <span class="brand-badge" x-show="brandName(m.brand_id)" x-text="brandName(m.brand_id)"></span>
            </td>
            <td x-text="m.sku_article || ''"></td>
            <td class="col-num" x-text="m.price_excl_vat.toFixed(2)"></td>
            <td class="col-num" x-text="m.price_incl_vat.toFixed(2)"></td>
            <td x-text="m.vat_rate + '%'"></td>
            <td></td>
          </tr>
        </template>
        <tr x-show="materials.length === 0">
          <td colspan="8" style="text-align:center; color:var(--ink-soft); padding:24px;">Ничего не найдено</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Модалка: одна на создание и редактирование -->
  <div class="modal-backdrop" x-show="modalOpen" x-cloak>
    <div class="modal">
      <div class="modal-header">
        <div>
          <h2 x-text="editing.id ? 'Редактирование материала' : 'Новый материал'"></h2>
          <div class="subtitle" x-show="editing.id" x-text="editing.short_name"></div>
        </div>
      </div>

      <div class="modal-body">
        <div class="field">
          <label>Short name</label>
          <input type="text" required placeholder="ABB S203 C16" x-model="editing.short_name">
          <span class="field-hint">Бренд-код + тип + параметры, через пробел</span>
        </div>

        <div class="field">
          <label>Full name</label>
          <input type="text" required placeholder="Автоматический выключатель 3P C16 6kA" x-model="editing.full_name">
        </div>

        <div class="field-row">
          <div class="field">
            <label>Бренд</label>
            <select x-model.number="editing.brand_id">
              <option :value="null">—</option>
              <template x-for="brand in brands" :key="brand.id">
                <option :value="brand.id" x-text="brand.name"></option>
              </template>
            </select>
          </div>
          <div class="field">
            <label>Артикул производителя</label>
            <input type="text" placeholder="2CDS253001R0164" x-model="editing.sku_article">
          </div>
        </div>

        <div class="price-pair">
          <div class="field">
            <label>Цена без НДС</label>
            <input type="number" step="0.01" x-model.number="editing.price_excl_vat" @input="onExclChange()">
          </div>
          <div class="field">
            <label>Цена с НДС</label>
            <input type="number" step="0.01" x-model.number="editing.price_incl_vat" @input="onInclChange()">
          </div>
          <div class="field" style="max-width:140px;">
            <label>Ставка НДС</label>
            <input type="number" step="0.1" x-model.number="editing.vat_rate" @input="onVatChange()">
          </div>
        </div>
        <div class="vat-note">↻ Пересчитывается автоматически при изменении одной из цен — можно переопределить вручную.</div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-danger-ghost" x-show="editing.id" @click="remove()">Удалить</button>
        <span x-show="!editing.id"></span>
        <div class="modal-footer-right">
          <button type="button" class="btn btn-ghost" @click="close()">Закрыть</button>
          <button type="button" class="btn btn-primary" @click="save()">Сохранить</button>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
function materialsPage() {
  return {
    materials: [],
    brands: [],
    q: '',
    activeBrandId: null,
    modalOpen: false,
    editing: {},
    lastChanged: 'price_excl_vat',

    async init() {
      await this.loadBrands();
      await this.load();
    },

    async loadBrands() {
      const res = await fetch('/api/brands');
      this.brands = await res.json();
    },

    async load() {
      const params = new URLSearchParams();
      if (this.q) params.set('q', this.q);
      if (this.activeBrandId) params.set('brand_id', this.activeBrandId);
      const res = await fetch('/api/materials?' + params.toString());
      this.materials = await res.json();
    },

    brandName(brandId) {
      const b = this.brands.find(b => b.id === brandId);
      return b ? b.name : '';
    },

    openCreate() {
      this.editing = { short_name: '', full_name: '', brand_id: null, sku_article: '', price_excl_vat: 0, price_incl_vat: 0, vat_rate: 20 };
      this.lastChanged = 'price_excl_vat';
      this.modalOpen = true;
    },

    openEdit(m) {
      this.editing = { ...m };
      this.lastChanged = 'price_excl_vat';
      this.modalOpen = true;
    },

    onExclChange() {
      this.lastChanged = 'price_excl_vat';
      this.editing.price_incl_vat = Math.round(this.editing.price_excl_vat * (1 + this.editing.vat_rate / 100) * 100) / 100;
    },
    onInclChange() {
      this.lastChanged = 'price_incl_vat';
      this.editing.price_excl_vat = Math.round(this.editing.price_incl_vat / (1 + this.editing.vat_rate / 100) * 100) / 100;
    },
    onVatChange() {
      this.onExclChange();
    },

    async save() {
      const payload = { ...this.editing, price_source: this.lastChanged };
      const isEdit = !!this.editing.id;
      const url = isEdit ? `/api/materials/${this.editing.id}` : '/api/materials';
      const method = isEdit ? 'PUT' : 'POST';

      const res = await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (!res.ok) { alert('Не удалось сохранить'); return; }

      this.modalOpen = false;
      await this.load();
    },

    async remove() {
      const res = await fetch(`/api/materials/${this.editing.id}`, { method: 'DELETE' });
      if (!res.ok) { alert('Не удалось удалить'); return; }

      this.modalOpen = false;
      await this.load();
    },

    close() {
      this.modalOpen = false;
    }
  };
}
</script>
{% endblock %}
