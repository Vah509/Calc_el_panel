{% extends "base.html" %}
{% block content %}
<div>

  <div class="topbar">
    <div class="topbar-title">
      <h1>Бренды</h1>
      <span class="count" id="brands-count">{{ brands|length }} позиций</span>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="btn btn-primary"
              hx-get="/brands/new"
              hx-target="#modal-slot"
              hx-swap="innerHTML">
        + Бренд
      </button>
    </div>
  </div>

  <div class="filterbar">
    <div class="search-wrap">
      <input class="search-input" type="text" name="q" id="brand-search" placeholder="Поиск по названию…"
             hx-get="/brands"
             hx-trigger="keyup changed delay:300ms"
             hx-target="body"
             hx-select="body > *"
             hx-swap="innerHTML">
      <button type="button" class="search-clear" title="Сбросить поиск"
              onclick="document.getElementById('brand-search').value=''; htmx.ajax('GET', '/brands', {target: 'body', select: 'body > *', swap: 'innerHTML'});">✕</button>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Название</th>
          <th style="width:140px">Материалов</th>
          <th style="width:70px"></th>
        </tr>
      </thead>
      <tbody id="brands-tbody">
        {% include "brands/_tbody.html" %}
      </tbody>
    </table>
  </div>

  <div id="modal-slot"></div>

</div>
{% endblock %}
