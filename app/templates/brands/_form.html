<div class="modal-backdrop"
     onclick="if (event.target === this) { window.__tryCloseModal(this); }"
     onkeydown="if (event.key === 'Escape') window.__tryCloseModal(this);">
  <div class="modal">
    <form hx-{% if brand %}put="/brands/{{ brand.id }}"{% else %}post="/brands"{% endif %}
          hx-target="body"
          hx-select="body > *"
          hx-swap="innerHTML"
          onchange="window.__modalDirty = true;">

      <div class="modal-header">
        <div>
          <h2>{{ "Редактирование бренда" if brand else "Новый бренд" }}</h2>
        </div>
        <button type="button" class="modal-close" onclick="window.__tryCloseModal(this)">✕</button>
      </div>

      <div class="modal-body">
        <div class="field">
          <label>Название</label>
          <input type="text" name="name" required
                 placeholder="ABB"
                 value="{{ brand.name if brand else '' }}">
        </div>
      </div>

      <div class="modal-footer">
        <span></span>
        <div class="modal-footer-right">
          <button type="button" class="btn btn-ghost" onclick="window.__tryCloseModal(this)">Отмена</button>
          <button type="submit" class="btn btn-primary">Сохранить</button>
        </div>
      </div>
    </form>
  </div>
</div>
