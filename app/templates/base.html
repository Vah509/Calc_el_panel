<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}ЭлектроЩит — Учёт калькуляций{% endblock %}</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/htmx/1.9.10/htmx.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.13.5/cdn.min.js"></script>
<script>
  // HTMX подменяет часть DOM динамически (модалки, обновлённые списки).
  // Alpine сам инициализирует только то, что было в HTML при первой загрузке страницы —
  // всё, что HTMX вставляет ПОСЛЕ этого, нужно инициализировать вручную,
  // иначе x-data/x-model/@click в новой разметке останутся "мёртвыми".
  document.body.addEventListener('htmx:afterSwap', (event) => {
    if (window.Alpine) {
      window.Alpine.initTree(event.target);
    }
    if (event.target && event.target.id === 'modal-slot') {
      window.__modalDirty = false;
    }
  });

  // Закрытие модалки — НЕ зависит от Alpine. Alpine на мобильных сетях может
  // ещё не успеть инициализироваться (defer + медленный CDN) к моменту клика,
  // поэтому крестик/Отмена работают через обычный DOM API напрямую.
  window.__modalDirty = false;
  window.__tryCloseModal = function (el) {
    if (window.__modalDirty && !confirm('Изменения не сохранены. Закрыть без сохранения?')) return;
    window.__modalDirty = false;
    const slot = document.getElementById('modal-slot');
    if (slot) slot.innerHTML = '';
  };

  // После успешного создания/изменения/удаления сервер шлёт заголовок
  // HX-Trigger: materialSaved / brandSaved — по нему закрываем модалку
  // без подтверждения (сохранение уже произошло, спрашивать нечего).
  document.body.addEventListener('materialSaved', () => {
    window.__modalDirty = false;
    const slot = document.getElementById('modal-slot');
    if (slot) slot.innerHTML = '';
  });
  document.body.addEventListener('brandSaved', () => {
    window.__modalDirty = false;
    const slot = document.getElementById('modal-slot');
    if (slot) slot.innerHTML = '';
  });
</script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav class="topnav" x-data="{ refOpen: false }">
  <div class="topnav-brand">ЭлектроЩит</div>
  <div class="topnav-menu">
    <div class="nav-dropdown" @click.outside="refOpen = false">
      <button class="nav-dropdown-btn" @click="refOpen = !refOpen" :class="{active: refOpen}">
        Справочники
        <span class="nav-caret">▾</span>
      </button>
      <div class="nav-dropdown-list" x-show="refOpen" x-cloak x-transition>
        <a href="/materials" class="nav-dropdown-item">Материалы</a>
        <a href="/brands" class="nav-dropdown-item">Бренды</a>
      </div>
    </div>
  </div>
</nav>
<main class="page-main">
{% block content %}{% endblock %}
</main>
</body>
</html>
